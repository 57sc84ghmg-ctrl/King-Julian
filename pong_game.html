<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>乒乓球 Pong</title>
<style>
  :root {
    --bg: #0d1117;
    --line: #2a3140;
    --p1: #58a6ff;
    --p2: #ff7b72;
    --accent: #3fb950;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; height: 100%;
  }
  #scoreboard {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    color: #8b949e;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  #scoreboard .score {
    font-size: 28px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  #p1score { color: var(--p1); }
  #p2score { color: var(--p2); }
  #canvasHolder {
    flex: 1; position: relative;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    background: var(--bg);
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    background: rgba(13,17,23,0.88);
    color: #e6edf3;
    text-align: center;
    padding: 24px;
  }
  #overlay h1 {
    font-size: 22px; font-weight: 600; margin: 0;
    color: var(--accent);
  }
  #overlay p { margin: 0; color: #8b949e; font-size: 14px; line-height: 1.5; max-width: 280px; }
  #startBtn {
    margin-top: 8px;
    padding: 12px 32px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0d1117;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #soundToggle {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    z-index: 5;
    opacity: 0.8;
  }
  #hint {
    text-align: center;
    color: #484f58;
    font-size: 12px;
    padding: 10px 0 16px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scoreboard">
    <div>你 <span class="score" id="p1score">0</span></div>
    <div style="color:#484f58;">先得 7 分獲勝</div>
    <div><span class="score" id="p2score">0</span> 電腦</div>
  </div>
  <div id="canvasHolder">
    <button id="soundToggle">🔊</button>
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>乒乓球</h1>
      <p>手指拖動畫面下半部來控制你的球拍（藍色）。先得 7 分獲勝。</p>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>
  <div id="hint">拖曳畫面移動球拍</div>
</div>

  let ballImgReady = false;
  ballImg.onload = () => { ballImgReady = true; };

  let audioCtx = null;
  let soundOn = true;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, duration, type, gainVal) {
    if (!soundOn) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = gainVal !== undefined ? gainVal : 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  }
  function sfxPaddleHit() { beep(420, 0.08, 'square', 0.18); }
  function sfxWallBounce() { beep(280, 0.06, 'triangle', 0.12); }
  function sfxScore(isPlayer) { beep(isPlayer ? 660 : 160, 0.28, 'sawtooth', 0.15); }
  function sfxWin() {
    if (!soundOn) return;
    ensureAudio();
    [523, 659, 784, 1046].forEach((f, i) => {
      setTimeout(() => beep(f, 0.18, 'triangle', 0.16), i * 110);
    });
  }
  function sfxLose() {
    if (!soundOn) return;
    ensureAudio();
    [400, 320, 240, 160].forEach((f, i) => {
      setTimeout(() => beep(f, 0.22, 'sawtooth', 0.14), i * 120);
    });
  }

  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) ensureAudio();
  });

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = holder.clientWidth;
    H = holder.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const PADDLE_W_RATIO = 0.24;
  const PADDLE_H = 14;
  const BALL_R = 22;
  const WIN_SCORE = 7;

  let state = 'idle';
  let p1 = { x: 0, w: 0, score: 0 };
  let p2 = { x: 0, w: 0, score: 0 };
  let ball = { x: 0, y: 0, vx: 0, vy: 0, spin: 0 };
  let ballAngle = 0;
  let lastTime = 0;

  function resetPaddles() {
    p1.w = W * PADDLE_W_RATIO;
    p2.w = W * PADDLE_W_RATIO;
    p1.x = W / 2 - p1.w / 2;
    p2.x = W / 2 - p2.w / 2;
  }

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    const speed = Math.min(W, H) * 0.55;
    const angle = (Math.random() * 0.6 - 0.3);
    ball.vx = speed * Math.sin(angle);
    ball.vy = speed * Math.cos(angle) * (direction || 1);
    ball.spin = (Math.random() - 0.5) * 4;
  }

  function startGame() {
    ensureAudio();
    resize();
    resetPaddles();
    p1.score = 0;
    p2.score = 0;
    p1scoreEl.textContent = '0';
    p2scoreEl.textContent = '0';
    resetBall(Math.random() > 0.5 ? 1 : -1);
    state = 'playing';
    overlay.classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);

  function setPaddleX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    p1.x = Math.max(0, Math.min(W - p1.w, x - p1.w / 2));
  }
  canvas.addEventListener('touchstart', (e) => {
    if (state !== 'playing') return;
    setPaddleX(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (state !== 'playing') return;
    setPaddleX(e.touches[0].clientX);
  }, { passive: true });
  canvas.addEventListener('mousedown', (e) => {
    if (state !== 'playing') return;
    setPaddleX(e.clientX);
  });
  canvas.addEventListener('mousemove', (e) => {
    if (state !== 'playing' || e.buttons !== 1) return;
    setPaddleX(e.clientX);
  });

  function aiMove(dt) {
    const targetCenter = ball.x;
    const aiCenter = p2.x + p2.w / 2;
    const maxSpeed = Math.min(W, H) * 0.85;
    const diff = targetCenter - aiCenter;
    const move = Math.sign(diff) * Math.min(Math.abs(diff), maxSpeed * dt);
    p2.x += move;
    p2.x = Math.max(0, Math.min(W - p2.w, p2.x));
  }

  function update(dt) {
    aiMove(dt);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ballAngle += ball.spin * dt;

    if (ball.x - BALL_R < 0) {
      ball.x = BALL_R;
      ball.vx *= -1;
      sfxWallBounce();
    } else if (ball.x + BALL_R > W) {
      ball.x = W - BALL_R;
      ball.vx *= -1;
      sfxWallBounce();
    }

    const p1Y = H - 40;
    if (ball.vy > 0 && ball.y + BALL_R >= p1Y && ball.y + BALL_R <= p1Y + PADDLE_H + 10) {
      if (ball.x >= p1.x && ball.x <= p1.x + p1.w) {
        ball.y = p1Y - BALL_R;
        const hitPos = (ball.x - (p1.x + p1.w / 2)) / (p1.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.04;
        const angle = hitPos * 0.9;
        ball.vx = speed * Math.sin(angle);
        ball.vy = -Math.abs(speed * Math.cos(angle));
        ball.spin = hitPos * 6;
        sfxPaddleHit();
      }
    }

    const p2Y = 40;
    if (ball.vy < 0 && ball.y - BALL_R <= p2Y && ball.y - BALL_R >= p2Y - PADDLE_H - 10) {
      if (ball.x >= p2.x && ball.x <= p2.x + p2.w) {
        ball.y = p2Y + BALL_R;
        const hitPos = (ball.x - (p2.x + p2.w / 2)) / (p2.w / 2);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.04;
        const angle = hitPos * 0.9;
        ball.vx = speed * Math.sin(angle);
        ball.vy = Math.abs(speed * Math.cos(angle));
        ball.spin = hitPos * 6;
        sfxPaddleHit();
      }
    }

    if (ball.y > H + BALL_R * 2) {
      p2.score++;
      p2scoreEl.textContent = p2.score;
      sfxScore(false);
      checkWin();
      if (state === 'playing') resetBall(-1);
    } else if (ball.y < -BALL_R * 2) {
      p1.score++;
      p1scoreEl.textContent = p1.score;
      sfxScore(true);
      checkWin();
      if (state === 'playing') resetBall(1);
    }
  }

  function checkWin() {
    if (p1.score >= WIN_SCORE || p2.score >= WIN_SCORE) {
      state = 'over';
      const youWin = p1.score >= WIN_SCORE;
      overlayH1.textContent = youWin ? '你贏了！' : '電腦贏了';
      overlayH1.style.color = youWin ? '#3fb950' : '#ff7b72';
      overlayP.textContent = `最終比分 ${p1.score} : ${p2.score}。再玩一次？`;
      startBtn.textContent = '再玩一次';
      overlay.classList.remove('hidden');
      if (youWin) sfxWin(); else sfxLose();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#2a3140';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(0, H / 2);
    ctx.lineTo(W, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#58a6ff';
    roundRect(ctx, p1.x, H - 40, p1.w, PADDLE_H, 6);
    ctx.fill();

    ctx.fillStyle = '#ff7b72';
    roundRect(ctx, p2.x, 40 - PADDLE_H, p2.w, PADDLE_H, 6);
    ctx.fill();

    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ballAngle);
    ctx.beginPath();
    ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (ballImgReady) {
      ctx.drawImage(ballImg, -BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);
    } else {
      ctx.fillStyle = '#f0f6fc';
      ctx.fillRect(-BALL_R, -BALL_R, BALL_R * 2, BALL_R * 2);
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.stroke();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loop(now) {
    if (state !== 'playing') return;
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  resetPaddles();
  ball.x = W / 2; ball.y = H / 2;
  draw();
})();
</script>
</body>
